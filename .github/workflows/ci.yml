name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Run tests
        run: |
          .venv/bin/pytest tests/ -v

      - name: Lint with ruff
        run: |
          .venv/bin/ruff check .

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .

      - name: Verify CLI works
        run: |
          .venv/bin/ai-factory --list
          .venv/bin/ai-factory --app threat-intel-analyzer --dry-run

      - name: Build package
        run: |
          .venv/bin/pip install build
          .venv/bin/python -m build

      - name: Check package contents
        run: |
          .venv/bin/pip install twine
          .venv/bin/twine check dist/*