services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-factory-backend
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_USER=${GH_USER:-ALANDVO}
      - EMAIL=${EMAIL:-alanvo@gmail.com}
      - BASE=/home/appuser/ai-factory/repos
      - LOG=/home/appuser/ai-factory/pushed.log
      - STATE=/home/appuser/ai-factory/state.json
      - DATABASE_URL=sqlite+aiosqlite:///./ai_factory.db
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - DEBUG=${DEBUG:-false}
    volumes:
      - backend_data:/home/appuser/ai-factory
      - backend_db:/app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-factory-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-factory-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-factory-network

